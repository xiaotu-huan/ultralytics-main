# YOLOv11n with CBAM and P2 detection configuration
nc: 6
depth_multiple: 0.33
width_multiple: 0.25

# 锚框配置（包含P2层）
anchors:
  - [4, 5, 8, 10, 13, 16] # P2/4
  - [16, 30, 33, 23, 30, 61] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [61, 119, 116, 90, 156, 198] # P5/32

scales:
  n: [0.50, 0.25, 1024]

# 骨干网络（Backbone）with CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_CBAM, [512, True]] # 6 (添加CBAM)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_CBAM, [1024, True]] # 8 (添加CBAM)
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# 检测头（Head）with P2 layer
head:
  # P5 -> P4 上采样
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: 连接第6层(512通道)
  - [-1, 2, C3k2, [512, False]] # 13

  # P4 -> P3 上采样
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15: 连接第4层(256通道)
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # P3 -> P2 上采样（新增P2路径）
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18: 连接第2层(P2特征)
  - [-1, 2, C3k2, [192, False]] # 19 (P2/4-xsmall)

  # P2 -> P3 下采样
  - [-1, 1, Conv, [192, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21: 连接第16层(P3特征)
  - [-1, 2, C3k2, [256, False]] # 22

  # P3 -> P4 下采样
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24: 连接第13层(P4特征)
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  # P4 -> P5 下采样
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27: 连接第10层(P5特征)
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  # 检测层（包含P2检测）
  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
