# YOLOv11n 管道缺陷检测（6类）- 仅P4/P5加CBAM配置
nc: 6
depth_multiple: 0.33
width_multiple: 0.25
anchors: 3

backbone: [
    # P1/2
    [-1, 1, Conv, [64, 3, 2]], # 0-P1/2（ch[0]=16？注意：ch列表是实际输出，可能与配置的[64]有width_multiple缩放）
    # P2/4
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4（ch[1]=32）
    [-1, 1, C2f, [128, 1]], # 2-P2/4（ch[2]=32）
    # P3/8 (无CBAM)
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8（ch[3]=64）
    [-1, 2, C2f, [256, 1]], # 4-P3/8（ch[4]=64）
    # P4/16 (加CBAM) - 关键修改：CBAM输入通道从512→128
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16（ch[5]=128）
    [-1, 2, C2f, [512, 1]], # 6-P4/16（ch[6]=128，前层输出）
    [-1, 1, CBAM, [128]], # 7-P4/16 CBAM（输入=前层输出128，而非512）
    # P5/32 (加CBAM) - 关键修改：CBAM输入通道从512→128
    [-1, 1, Conv, [512, 3, 2]], # 8-P5/32（ch[8]=128）
    [-1, 1, C2f, [512, 1]], # 9-P5/32（ch[9]=128，前层输出）
    [-1, 1, CBAM, [128]], # 10-P5/32 CBAM（输入=前层输出128，而非512）
    # SPPF
    [-1, 1, SPPF, [512, 5]], # 11-P5/32（ch[11]=128）
  ]

head: [
    # P5->P4
    [-1, 1, Conv, [256, 1, 1]], # 12（ch[12]=64）
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 13（ch[13]=64）
    [[-1, 7], 1, Concat, [1]], # 14 cat backbone P4（ch[14]=64+128=192）
    [-1, 1, C2f, [256, False]], # 15（ch[15]=64）
    # P4->P3
    [-1, 1, Conv, [128, 1, 1]], # 16（ch[16]=32）
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 17（ch[17]=32）
    [[-1, 4], 1, Concat, [1]], # 18 cat backbone P3（ch[18]=32+64=96）
    [-1, 1, C2f, [128, False]], # 19 (P3/8-small)（ch[19]=32）
    # P3->P4
    [-1, 1, Conv, [128, 3, 2]], # 20（ch[20]=32）
    [[-1, 16], 1, Concat, [1]], # 21 cat head P4（ch[21]=32+32=64）
    [-1, 1, C2f, [256, False]], # 22 (P4/16-medium)（ch[22]=64）
    # P4->P5
    [-1, 1, Conv, [256, 3, 2]], # 23（ch[23]=64）
    [[-1, 12], 1, Concat, [1]], # 24 cat head P5（ch[24]=64+64=128）
    [-1, 1, C2f, [512, False]], # 25 (P5/32-large)（ch[25]=128）
    # Detect - 保持你修改后的[nc]参数
    [[19, 22, 25], 1, Detect, [nc]], # 26 Detect(P3, P4, P5)
  ]
