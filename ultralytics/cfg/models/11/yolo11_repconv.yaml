# YOLO11n backbone with RepConv 替换版
# 保证通道数对齐，避免16/128错位

nc: 6 # number of classes
depth_multiple: 1.0 # 不缩放深度
width_multiple: 1.0 # 不缩放通道

backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, RepConv, [128, 3, 2, 1, 1, 1, True, True]] # c1=64, c2=128
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, RepConv, [256, 3, 2, 1, 1, 1, True, True]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, RepConv, [512, 3, 2, 1, 1, 1, True, True]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [9, 1, Conv, [512, 1, 1]] # 11
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13
  - [-1, 3, C3k2, [512]] # 14

  - [-1, 1, Conv, [256, 1, 1]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17
  - [-1, 3, C3k2, [256]] # 18

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20
  - [-1, 3, C3k2, [512]] # 21

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 11], 1, Concat, [1]] # 23
  - [-1, 3, C3k2, [1024]] # 24

  - [[18, 21, 24], 1, Detect, [nc]] # Detect(P3, P4, P5)
