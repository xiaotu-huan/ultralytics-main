# YOLOv11n with CBAM and Slim-Neck
nc: 6
depth_multiple: 0.33
width_multiple: 0.25
anchors: 3

# Backbone with CBAM
backbone:
  # 初始卷积层
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_CBAM, [512, True]] # 6 (加入CBAM)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_CBAM, [1024, True]] # 8 (加入CBAM)
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Slim-Neck head with GSConv and VoV_GSCSP
head:
  # 上采样: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12: 连接第6层(带CBAM的512通道)
  - [-1, 1, VoV_GSCSP, [512, 1]] # 13

  # 上采样: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15: 连接第4层(512通道)
  - [-1, 1, VoV_GSCSP, [256, 1]] # 16 (P3-small)

  # 下采样: P3 -> P4
  - [-1, 1, GSConv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18: 连接第13层(512通道)
  - [-1, 1, VoV_GSCSP, [512, 1]] # 19 (P4-medium)

  # 下采样: P4 -> P5
  - [-1, 1, GSConv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21: 连接第10层(1024通道)
  - [-1, 1, VoV_GSCSP, [1024, 1]] # 22 (P5-large)

  # Detect
  - [[16, 19, 22], 1, Detect, [nc]] # 23
