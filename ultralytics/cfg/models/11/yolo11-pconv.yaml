# yolo11-pconv-final.yaml
nc: 6
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # 第0-4层保持不变
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [128]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [256]] # 4

  # 🔥 替换1：第5层 Conv → PConv (stride=2)
  - [-1, 1, PConv, [512, 3, 2, 4, "split_cat"]] # 5-P4/16

  - [-1, 2, C3k2, [512, True]] # 6

  # 🔥 替换2：第7层 Conv → PConv (stride=2)
  - [-1, 1, PConv, [1024, 3, 2, 4, "split_cat"]] # 7-P5/32

  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # 上采样路径1 (P5 → P4)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, False]] # 13

  # 上采样路径2 (P4 → P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, False]] # 16-P3/8-small

  # 下采样路径1 (P3 → P4)
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, False]] # 19-P4/16-medium

  # 下采样路径2 (P4 → P5)
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [1024, False]] # 22-P5/32-large

  # 检测头
  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5)
