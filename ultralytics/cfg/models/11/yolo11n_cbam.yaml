# YOLOv11n 管道缺陷检测（6类）- 仅P4/P5加CBAM配置
nc: 6
depth_multiple: 0.16
width_multiple: 0.25
anchors: 3

# backbone（仅P4/P5层加CBAM，P3层无CBAM）
backbone:
  [
    # P1/2
    [-1, 1, Conv, [32, 3, 2]],        # 0 → ch[0]=8
    # P2/4
    [-1, 1, Conv, [64, 3, 2]],        # 1 → ch[1]=16
    [-1, 1, C2f, [64, True]],         # 2 → ch[2]=16
    # P3/8（无CBAM）
    [-1, 1, Conv, [128, 3, 2]],       # 3 → ch[3]=32
    [-1, 2, C2f, [128, True]],        # 4 → ch[4]=32
    # P4/16（加CBAM）
    [-1, 1, Conv, [256, 3, 2]],       # 5 → ch[5]=64
    [-1, 2, C2f, [256, True]],        # 6 → ch[6]=64
    [-1, 1, CBAM, [64, 16]],          # 7 → ch[7]=64（P4层CBAM）
    # P5/32（加CBAM）
    [-1, 1, Conv, [512, 3, 2]],       # 8 → ch[8]=128
    [-1, 1, C2f, [512, True]],        # 9 → ch[9]=128
    [-1, 1, CBAM, [128, 16]],         #10 → ch[10]=128（P5层CBAM）
    # SPPF
    [-1, 1, SPPF, [512, 5]],          #11 → ch[11]=128
  ]

# head（同步调整backbone引用索引）
head:
  [
    # P5→P4融合（引用P4-CBAM后索引7）
    [-1, 1, Conv, [256, 1, 1]],       #12 → ch[12]=64
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], #13 → ch[13]=64
    [[-1, 7], 1, Concat, [1]],        #14 → ch[14]=128
    [-1, 1, C2f, [256, False]],       #15 → ch[15]=64
    # P4→P3融合（引用P3无CBAM索引4）
    [-1, 1, Conv, [128, 1, 1]],       #16 → ch[16]=32
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], #17 → ch[17]=32
    [[-1, 4], 1, Concat, [1]],        #18 → ch[18]=64
    [-1, 1, C2f, [128, False]],       #19 → ch[19]=32（P3尺度）
    # P3→P4融合
    [-1, 1, Conv, [128, 3, 2]],       #20 → ch[20]=32
    [[-1, 16], 1, Concat, [1]],       #21 → ch[21]=64
    [-1, 1, C2f, [256, False]],       #22 → ch[22]=64（P4尺度）
    # P4→P5融合
    [-1, 1, Conv, [256, 3, 2]],       #23 → ch[23]=64
    [[-1, 12], 1, Concat, [1]],       #24 → ch[24]=128
    [-1, 1, C2f, [512, False]],       #25 → ch[25]=128（P5尺度）
    # 3尺度检测
    [[19, 22, 25], 1, Detect, [nc]],  #26 → 融合P3(19)、P4(22)、P5(25)
  ]