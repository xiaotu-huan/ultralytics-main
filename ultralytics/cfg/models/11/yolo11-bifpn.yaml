# YOLOv11n 管道缺陷检测（6类）
task: detect
nc: 6
depth_multiple: 0.33
width_multiple: 0.25
anchors: 3  # 顶层anchors参数，Detect层会自动读取

# YOLO11n backbone（保持不变）
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2 (64*0.25=16)
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4 (128*0.25=32)
  - [-1, 2, C3k2, [256]]  # 2 (256*0.25=64)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8 (256*0.25=64)
  - [-1, 2, C3k2, [512]]  # 4 (512*0.25=128)
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16 (512*0.25=128)
  - [-1, 2, C3k2, [512]]  # 6 (512*0.25=128)
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32 (1024*0.25=256)
  - [-1, 2, C3k2, [1024]]  # 8 (1024*0.25=256)
  - [-1, 1, SPPF, [1024, 5]]  # 9 (1024*0.25=256)
  - [-1, 2, C2PSA, [1024]]  # 10 (1024*0.25=256)

# YOLO11n head with BiFPN（关键修改：指定BiFPN输出通道）
head:
  # 1. P5(256ch) -> 上采样 -> 与P4(128ch) BiFPN融合，输出128ch（匹配后续C3k2 [512] = 128ch）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11 (256ch)
  - [[-1, 6], 1, BiFPN_Concat, [1, 128]]  # 12：维度=1，输出通道=128（关键修改）
  - [-1, 2, C3k2, [512]]  # 13 (512*0.25=128ch，输入输出匹配)

  # 2. P4(128ch) -> 上采样 -> 与P3(128ch) BiFPN融合，输出64ch（匹配后续C3k2 [256] = 64ch）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 14 (128ch)
  - [[-1, 4], 1, BiFPN_Concat, [1, 64]]  # 15：维度=1，输出通道=64（关键修改）
  - [-1, 2, C3k2, [256]]  # 16 (256*0.25=64ch，输入输出匹配)

  # 3. P3(64ch) -> 下采样 -> 与P4(128ch) BiFPN融合，输出128ch（匹配后续C3k2 [512] = 128ch）
  - [-1, 1, Conv, [256, 3, 2]]  # 17：64ch -> 256*0.25=64ch（下采样，通道暂存64）
  - [[-1, 13], 1, BiFPN_Concat, [1, 128]]  # 18：维度=1，输出通道=128（关键修改）
  - [-1, 2, C3k2, [512]]  # 19 (512*0.25=128ch，输入输出匹配)

  # 4. P4(128ch) -> 下采样 -> 与P5(256ch) BiFPN融合，输出256ch（匹配后续C3k2 [1024] = 256ch）
  - [-1, 1, Conv, [512, 3, 2]]  # 20：128ch -> 512*0.25=128ch（下采样，通道暂存128）
  - [[-1, 10], 1, BiFPN_Concat, [1, 256]]  # 21：维度=1，输出通道=256（关键修改）
  - [-1, 2, C3k2, [1024]]  # 22 (1024*0.25=256ch，输入输出匹配)

  # 5. Detect层（仅传nc，anchors从顶层读取）
  - [[16, 19, 22], 1, Detect, [nc]]  # 23：输入通道64/128/256，与Detect层要求匹配